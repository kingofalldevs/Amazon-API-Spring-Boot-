spring.application.name=api-app


spring.datasource.url=jdbc:postgresql://localhost:5432/booksdb
spring.datasource.username=apple
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.ai.deepseek.api-key=
spring.profiles.active=local

# Open-Meteo is keyless; set WEATHER_API_KEY only if you switch to the commercial endpoint.
weather.api.base-url=https://api.open-meteo.com/v1
weather.api.key=${WEATHER_API_KEY:}
weather.api.connect-timeout=3s
weather.api.read-timeout=5s